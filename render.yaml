services:
  - type: web
    name: tambola-game
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        fromDatabase:
          name: tambola-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tambola-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tambola-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tambola-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tambola-db
          property: password

databases:
  - name: tambola-db
    databaseName: tambola_game
    user: postgres
    plan: free
